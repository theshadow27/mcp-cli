name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deduplicate runs per branch: cancel stale PR runs on force-push, but let every
# main merge complete. Push triggers are restricted to main to avoid double-firing
# (push + pull_request) on PR branches — the duplicate creates both CANCELLED and
# SUCCESS check-runs on the same SHA, which blocks branch protection (#1621).
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Detect whether this PR touches only docs: *.md anywhere, plus the
  # enumerated docs-only .claude/ subdirs (diary, sprints, memory). Other
  # .claude/ paths are NOT docs — .claude/phases/*.ts are executable phase
  # scripts tested by `am-i-done --ci` (test:phases, #2648), and automation/
  # workflows/skills also carry runnable code (#2717). Config files (*.json,
  # .github/**, scripts/**, .git-hooks/**) and all source code are NOT
  # docs-only. push-to-main and workflow_dispatch events are never docs-only.
  # Sets output docs_only=true to let check/coverage/build skip work.
  # Keep the docs pattern in sync with .git-hooks/classify.sh.
  #
  # Security: the file list is read from the GitHub API (origin's view), not from
  # the PR's checkout. The classification logic is inlined here so a malicious PR
  # cannot modify .git-hooks/classify.sh to force docs_only=true and bypass CI.
  detect:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | .claude/diary/* | .claude/sprints/* | .claude/memory/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          if [ "$docs_only" = "true" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only PR — check/coverage/build will be skipped"
            printf '%s\n' "Changed files:" "$changed"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    needs: [detect]
    steps:
      - name: Skip (docs-only PR)
        if: needs.detect.outputs.docs_only == 'true'
        run: echo "Docs-only PR — skipping check"
      - uses: actions/checkout@v6
        if: needs.detect.outputs.docs_only != 'true'
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.docs_only != 'true'
        with:
          bun-version-file: package.json
      - if: needs.detect.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile
      # Single source of truth: `am-i-done --ci` (the am-i-done package, stages in
      # scripts/stages/) runs bun-version, typecheck, lint (check only), the
      # doing-it-wrong rules, agent-grid, phase-lock, stale-todos, the split
      # non-daemon / daemon partitions (sequential, with the #1004 crash
      # tolerance in scripts/stages/_lib/bun-test.ts), the phase and hook
      # specs, and the coverage ratchet. `--skip coverage` defers the ratchet
      # to the `coverage` job so the two run in parallel.
      #
      # CI is the unforgettable backstop since hooks are bypassable (--no-verify,
      # web edits, force-push). The static-only equivalent is `--pre-commit`.
      # The run's ceiling is done.toml's deadline_seconds (#3261).
      - name: am-i-done --ci (everything but coverage)
        if: needs.detect.outputs.docs_only != 'true'
        env:
          # stale-todos asks GitHub whether each cited issue is still open.
          GH_TOKEN: ${{ github.token }}
        run: bun run am-i-done --ci --skip coverage --verbose
      # The test stages keep each run's output in build/test-logs/ for this upload.
      - name: Upload test logs
        if: always() && needs.detect.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-logs/test_*.txt
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    needs: [detect]
    steps:
      - name: Skip (docs-only PR)
        if: needs.detect.outputs.docs_only == 'true'
        run: echo "Docs-only PR — skipping coverage"
      - uses: actions/checkout@v6
        if: needs.detect.outputs.docs_only != 'true'
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.docs_only != 'true'
        with:
          bun-version-file: package.json
      - if: needs.detect.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile
      # The coverage ratchet: am-i-done's `coverage` stage runs
      # `scripts/check-coverage.ts --ci` with the #1419 / #1004
      # panic-on-teardown tolerance (scripts/stages/coverage.stage.ts).
      # Backstops the ratchet against PRs merged without hooks (#1252 / #2345).
      - name: am-i-done --ci --only coverage
        if: needs.detect.outputs.docs_only != 'true'
        run: bun run am-i-done --ci --only coverage --verbose
      - name: Upload coverage logs
        if: always() && needs.detect.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bun-coverage-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-logs/coverage_*.txt
          if-no-files-found: ignore
          retention-days: 30

  pty-test:
    runs-on: ubuntu-latest
    needs: [check, detect]
    steps:
      - name: Skip (docs-only PR)
        if: needs.detect.outputs.docs_only == 'true'
        run: echo "Docs-only PR — skipping pty-test"
      - uses: actions/checkout@v6
        if: needs.detect.outputs.docs_only != 'true'
        with:
          token: ${{ github.token }}
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.docs_only != 'true'
        with:
          bun-version-file: package.json
      - if: needs.detect.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile
      # Run historically PTY-sensitive spec files under a real PTY via util-linux
      # `script` (preinstalled on the runner — no apt step; apt DNS resolution is
      # broken on the ubuntu-26.04 image, which failed every pty-test run).
      # These tests failed in #2016 when stdout.isTTY was true and color codes
      # leaked into assertions. The NO_COLOR preload (bunfig.toml) makes this
      # pass today; this job catches regressions if the preload is ever removed.
      - name: Test (PTY — TTY-sensitive files)
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          set +e
          script -qec "bun test --no-orphans packages/command/src/commands/claude.spec.ts packages/control/src/components/metrics-panel.spec.ts" /dev/null 2>&1 | tee /tmp/test_pty.txt
          code=${PIPESTATUS[0]}
          if [ $code -eq 0 ]; then
            exit 0
          elif grep -q "^ 0 fail$" /tmp/test_pty.txt; then
            echo "::error::Bun crashed (exit $code) after all PTY tests passed. #1004 is CLOSED (fixed upstream 2026-04-11) — do NOT file under it. Open the bun.report URL from the crash output so Bun gets the telemetry, then file a NEW issue with the bun.report URL, crash address, Bun version, and this commit SHA (per CLAUDE.md)."
            exit $code
          else
            exit $code
          fi
      - name: Upload PTY test logs
        if: always() && needs.detect.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bun-pty-test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/test_pty.txt
          if-no-files-found: ignore
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [check, detect]
    steps:
      - name: Skip (docs-only PR)
        if: needs.detect.outputs.docs_only == 'true'
        run: echo "Docs-only PR — skipping build"
      - uses: actions/checkout@v6
        if: needs.detect.outputs.docs_only != 'true'
      - uses: oven-sh/setup-bun@v2
        if: needs.detect.outputs.docs_only != 'true'
        with:
          bun-version-file: package.json
      - if: needs.detect.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile
      - if: needs.detect.outputs.docs_only != 'true'
        run: bun scripts/build.ts
      - if: needs.detect.outputs.docs_only != 'true'
        run: ls -lh dist/
      # Compiled-binary smoke (#2797): exercises dist/mcx, dist/mcpd, and
      # dist/mcpctl end-to-end against an isolated throwaway MCP_CLI_DIR —
      # version injection, mcpctl no-TTY guard, `mcx ls`, the alias
      # save/call/delete cycle (the #2821 compiled alias-dispatch class), and
      # a full mcx → mcpd → mock session-worker spawn (the #2762 class that
      # `bun test` on source can never catch). Lives here rather than in the
      # am-i-done runner because it needs the freshly compiled dist/ binaries,
      # which only the build job produces — same placement rationale as the
      # Playwright resolver smoke below. Crash policy: retry once on a Bun
      # crash (exit 132/139) as flake insurance, then FAIL. This deliberately
      # does NOT mirror the pass-on-double-crash wrapper of the older smoke
      # steps: #1004 is CLOSED (fixed upstream 2026-04-11), and a
      # deterministic segfault in the compiled binaries is exactly the
      # regression class this gate exists to block.
      - name: Compiled binary smoke test
        if: needs.detect.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          set +e
          bun run smoke-test 2>&1 | tee /tmp/smoke_test.txt
          code=${PIPESTATUS[0]}
          if [ $code -eq 0 ]; then
            exit 0
          elif [ $code -eq 132 ] || [ $code -eq 139 ]; then
            echo "::warning::Bun crash (exit $code) during binary smoke test — retrying once"
            bun run smoke-test 2>&1 | tee /tmp/smoke_test_retry.txt
            code2=${PIPESTATUS[0]}
            if [ $code2 -eq 0 ]; then
              exit 0
            elif [ $code2 -eq 132 ] || [ $code2 -eq 139 ]; then
              echo "::error::Bun crashed twice consecutively (exit $code2) during the binary smoke test. #1004 is CLOSED (fixed upstream) — do NOT file under it. Open the bun.report URL from the crash output so Bun gets the telemetry, then file a NEW issue with the bun.report URL, crash address, Bun version, and this commit SHA (per CLAUDE.md)."
              exit $code2
            else
              exit $code2
            fi
          else
            exit $code
          fi
      - name: Playwright resolver binary smoke test
        if: needs.detect.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          set +e
          bun scripts/smoke-playwright.ts 2>&1 | tee /tmp/smoke_playwright.txt
          code=${PIPESTATUS[0]}
          if [ $code -eq 0 ]; then
            exit 0
          elif [ $code -eq 132 ] || [ $code -eq 139 ]; then
            echo "::warning::Bun crash (exit $code) during playwright smoke test — retrying once"
            bun scripts/smoke-playwright.ts 2>&1 | tee /tmp/smoke_playwright_retry.txt
            code2=${PIPESTATUS[0]}
            if [ $code2 -eq 0 ]; then
              exit 0
            elif [ $code2 -eq 132 ] || [ $code2 -eq 139 ]; then
              echo "::error::Bun crashed twice consecutively (exit $code2) during the playwright smoke test. #1004 is CLOSED (fixed upstream 2026-04-11) — do NOT file under it. Open the bun.report URL from the crash output so Bun gets the telemetry, then file a NEW issue with the bun.report URL, crash address, Bun version, and this commit SHA (per CLAUDE.md)."
              exit $code2
            else
              exit $code2
            fi
          else
            exit $code
          fi
      # Verify compiled binary contains embedded seed assets (wiggle.js + config.json).
      # Catches regressions where bun build --compile silently drops { type: "text" }
      # or resolveJsonModule imports — the kind that passes bun test but ships broken.
      # See #1592 (original bug), PR #1657 (fix), #1682 (this guard).
      - name: Seed embedding smoke test
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          fail=0
          check() {
            local label="$1" pattern="$2"
            # Bun stores non-Latin-1 text (teams wiggle.js has "→") as UTF-16LE, so search both encodings.
            if { strings dist/mcpd; strings -e l dist/mcpd; } | grep -q "$pattern"; then
              echo "  PASS: $label ($pattern)"
            else
              echo "  FAIL: $label ($pattern) — not found in dist/mcpd"
              fail=1
            fi
          }
          echo "Checking embedded seed assets in dist/mcpd..."
          check "teams wiggle.js"   "AUTOSUGGEST_INPUT"
          check "teams config.json" "substrate.office.com"
          check "owa config.json"   "outlook.cloud.microsoft"
          if [ $fail -ne 0 ]; then
            echo "One or more seed assets are missing from the compiled binary."
            echo "Check that all imports in packages/daemon/src/site/seeds.ts use"
            echo "static imports (resolveJsonModule for .json, { type: 'text' } for .js)."
            exit 1
          fi
          echo "All seed assets confirmed embedded."
